name: Password link validation
on:
  pull_request:
    paths:
      - 'supabase/functions/global-user-admin/**'
      - 'tests/global-user-admin.test.mjs'
      - '.github/workflows/password-link.yml'
permissions:
  contents: read
jobs:
  password-link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/global-user-admin.test.mjs
